; Claude Usage Gauge — Waveshare ESP32-S3-Touch-LCD-2 (ESP32-S3R8, 8MB octal PSRAM, 16MB flash)
; Build/flash:  pio run -t upload      Monitor: pio device monitor
[env:esp32-s3-touch-lcd-2]
platform = espressif32
board = esp32-s3-devkitc-1            ; generic S3; PSRAM/flash set explicitly below
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial over native USB (so bridge.py can talk to it)
    -DARDUINO_USB_MODE=1

board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8 = octal (OPI) PSRAM
board_upload.flash_size = 16MB
board_build.flash_mode = qio

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.0
