<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage — Desk Screen Preview</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(circle at 50% 26%, #141417 0%, #050506 70%);
    color: #e8e8ea;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 26px; box-sizing: border-box;
  }
  .title { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #6c6c78; }

  /* ===== THE DEVICE: a hard 240x320 panel, rendered 1:1 (no zoom). =====
     Everything inside .bezel is exactly what ships to the 2" screen. */
  .bezel {
    width: 256px; height: 336px; border-radius: 18px;
    background: linear-gradient(145deg, #26262b, #0c0c0f);
    padding: 8px; box-sizing: border-box;
    box-shadow: 0 18px 44px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.06), 0 0 40px rgba(217,119,87,.07);
  }
  #screen {
    display: block;
    width: 240px; height: 320px;          /* TRUE SIZE — 1 canvas px = 1 device px */
    border-radius: 10px;
    background: #161616;
    image-rendering: pixelated;            /* no smoothing — what the panel shows */
  }
  .sizehint { font-size: 11px; letter-spacing: .06em; color: #5f5f6a; }
  .sizehint b { color: #9a9aa6; font-weight: 600; }

  /* ===== dev controls — OUTSIDE the device box, never shipped ===== */
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: #7a7a86; }
  .row .lbl { color: #5f5f6a; letter-spacing: .04em; }
  .row button {
    background:#1a1a20; color:#cfcfd6; border:1px solid #34343c; border-radius:7px;
    padding:4px 9px; font-size:12px; cursor:pointer;
  }
  .row button:hover { border-color:#5a5a66; color:#fff; }
  .controls label { display: flex; align-items: center; gap: 6px; color:#b9b9c2; font-size:13px; }
  .controls input {
    width: 56px; background: #1a1a20; color: #f0f0f2; border: 1px solid #34343c;
    border-radius: 8px; padding: 5px 6px; font-size: 13px; text-align: center;
  }
  .cap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6c6c78; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 8px #4ADE80; }
  .note { max-width: 430px; text-align: center; font-size: 12px; line-height: 1.55; color: #6f6f7a; }
  hr.sep { width: 280px; border: 0; border-top: 1px solid #1e1e24; margin: 4px 0; }
</style>
</head>
<body>
  <div class="title">Claude Usage · Desk Screen</div>

  <div class="bezel"><canvas id="screen" width="240" height="320"></canvas></div>
  <div class="sizehint"><b>240 × 320 px</b> · actual device resolution — no zoom</div>

  <hr class="sep">

  <div class="row controls">
    <label>Session redline <input id="sbudget" type="number" min="1" step="1" value="100"> M</label>
    <label>Week redline <input id="wbudget" type="number" min="1" step="1" value="900"> M</label>
  </div>
  <div class="row">
    <span class="lbl">preview:</span>
    <button data-live="1">live</button>
    <button data-s="34" data-w="28">calm</button>
    <button data-s="66" data-w="74">focused</button>
    <button data-s="88" data-w="72">worried</button>
    <button data-s="98" data-w="95">dead</button>
  </div>
  <div class="cap"><span class="dot"></span><span id="updated">starting…</span></div>
  <p class="note">Vibe gauge — not an official fuel gauge. Limits are your own estimates (Anthropic doesn't publish the real ones). The box above is the literal 240×320 panel at 1:1.</p>

<script>
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  // TRUE SIZE: backing buffer is exactly 240x320 — one canvas pixel maps to one
  // hardware pixel. No devicePixelRatio scaling, no zoom. What you see ships.
  const SCREEN_W = 240, SCREEN_H = 320;     // Waveshare ESP32-S3 2" panel (240x320)
  canvas.width = SCREEN_W;
  canvas.height = SCREEN_H;
  canvas.style.width = SCREEN_W + 'px';
  canvas.style.height = SCREEN_H + 'px';

  // =====================================================================
  //  YOUR PERSONAL REDLINES  —  edit these two numbers
  //  ESTIMATES you set yourself, NOT Anthropic's real limits (unpublished).
  //  Device is a "vibe gauge": percent = tokens_used / your_redline, cap 100.
  //  Primary = rolling 5h SESSION, secondary = rolling 7d WEEK.
  // =====================================================================
  const SESSION_BUDGET_TOKENS = 100_000_000;  // ~5h session redline (personal estimate)
  const WEEKLY_BUDGET_TOKENS  = 900_000_000;  // ~7d weekly redline  (personal estimate)

  let sessionBudget = SESSION_BUDGET_TOKENS;
  let weekBudget = WEEKLY_BUDGET_TOKENS;

  let sessionVal = 0, weekVal = 0;          // live token totals from the server
  let demoSession = null, demoWeek = null;  // preview-only overrides (fractions 0..1)
  let sessionTarget = 0, weekTarget = 0;    // 0..1 (used / budget)
  let sessionShown = 0, weekShown = 0;      // animated fill
  let alert = { type: 'none', project: '' };// attention beacon from /usage (hook.py)

  // ---------- palette ----------
  const SCREEN_BG = '#161616';
  const GREEN = '#4ADE80', AMBER = '#F59E0B', RED = '#EF4444';
  const EMPTY_PRIMARY = '#2c2c2c';          // unfilled track (dark gray)
  const ORANGE = '#C2613D', HILITE = '#E0986E', EYE = '#100f12', SWEAT = '#bfe3ff';

  // colour means exactly ONE thing: how close to the limit
  function primaryColor(p) { return p < 0.5 ? GREEN : (p < 0.8 ? AMBER : RED); }
  // face escalates on the WORSE of the two %: 0 calm, 1 focused, 2 worried, 3 dead
  function faceLevel(p) { return p < 0.5 ? 0 : (p < 0.8 ? 1 : (p < 0.95 ? 2 : 3)); }

  // ---------- pixel creature (no cream outline; lighter top-highlight rim) ----------
  const ART = [
    ".OOOOOOOOOOOOOO.",
    ".OOOOOOOOOOOOOO.",
    "OOOOOOOOOOOOOOOO",
    "OOOOOOOOOOOOOOOO",
    ".OOOBBOOOOBBOOO.",
    ".OOOBBOOOOBBOOO.",
    ".OOOOOOOOOOOOOO.",
    ".OOOOOOOOOOOOOO.",
    ".OOOOOOOOOOOOOO.",
    ".OOOOOOOOOOOOOO.",
    ".OOOOOOOOOOOOOO.",
    ".OOO..OOOO..OOO.",
    ".OOO..OOOO..OOO."
  ];
  const FACES = {
    0: { eye: [[4,4],[5,4],[4,5],[5,5], [10,4],[11,4],[10,5],[11,5]], sweat: [] },
    1: { eye: [[3,5],[4,5],[5,5], [10,5],[11,5],[12,5]], sweat: [] },
    2: { eye: [[4,5],[5,5],[10,5],[11,5], [5,3],[4,3],[3,4], [10,3],[11,3],[12,4], [7,9],[8,9]], sweat: [[13,3],[13,4]] },
    3: { eye: [[3,3],[5,3],[4,4],[3,5],[5,5], [9,3],[11,3],[10,4],[9,5],[11,5], [6,9],[7,9],[8,9],[9,9]], sweat: [] }
  };

  function drawCreature(cx, cy, px, level) {
    const rows = ART.length, cols = ART[0].length;
    const ox = Math.round(cx - (cols * px) / 2), oy = Math.round(cy - (rows * px) / 2);
    const INF = 0.5;   // tiny overlap kills hairline seams between cells
    const block = (c, r) => ctx.fillRect(ox + c * px - INF, oy + r * px - INF, px + 2 * INF, px + 2 * INF);

    ctx.fillStyle = ORANGE;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (ART[r][c] !== '.') block(c, r);

    // lighter top-highlight only: topmost body cell of each column (rim light, no surrounding frame)
    ctx.fillStyle = HILITE;
    for (let c = 0; c < cols; c++)
      for (let r = 0; r < rows; r++)
        if (ART[r][c] !== '.') { block(c, r); break; }

    const f = FACES[level] || FACES[0];
    ctx.fillStyle = EYE;
    for (const cr of f.eye) block(cr[0], cr[1]);
    ctx.fillStyle = SWEAT;
    for (const cr of f.sweat) block(cr[0], cr[1]);
  }

  // ---------- horizontal rounded fill bar ----------
  function roundedPath(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }
  function drawBar(label, x, y, w, h, pct, fillCol) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#8a8a93';
    ctx.font = '700 11px Consolas, "Courier New", monospace';
    ctx.fillText(label, x + 1, y - 6);
    roundedPath(x, y, w, h, h / 2); ctx.fillStyle = EMPTY_PRIMARY; ctx.fill();      // dark-gray track (#2c2c2c)
    const fw = Math.max(h, Math.min(1, Math.max(0, pct)) * w);                      // pill grows from the left
    roundedPath(x, y, fw, h, h / 2); ctx.fillStyle = fillCol; ctx.fill();           // colour = closeness only
  }

  // ---------- compose (this is the literal screen) ----------
  function draw() {
    ctx.clearRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.fillStyle = SCREEN_BG;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);   // the whole 240x320 panel (#161616)
    // TODO phase2: touch — panel is capacitive, but no touch handling is built yet

    drawCreature(120, 80, 6, faceLevel(Math.max(sessionTarget, weekTarget)));        // face, large, near the top
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = primaryColor(sessionTarget);
    ctx.font = '700 38px Consolas, "Courier New", monospace';
    ctx.fillText(Math.round(sessionTarget * 100) + '%', 120, 166);                    // big session %
    drawBar('SESSION · 5h', 30, 202, 180, 18, sessionShown, primaryColor(sessionTarget));
    drawBar('WEEK · 7d',    30, 254, 180, 18, weekShown,    primaryColor(weekTarget));

    // ---- attention beacon: pulse a border when Claude needs you / is done ----
    //   amber = needs you (permission / idle),  green = finished a long turn.
    //   Driven by /usage -> alert (hook.py). Auto-clears when the alert expires.
    if (alert && (alert.type === 'attention' || alert.type === 'done')) {
      const col = alert.type === 'attention' ? AMBER : GREEN;
      const ms = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      const a = 0.30 + 0.50 * (0.5 + 0.5 * Math.sin(ms / 250));   // ~0.6 Hz pulse
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = col;
      ctx.lineWidth = 10;
      roundedPath(7, 7, SCREEN_W - 14, SCREEN_H - 14, 14);        // inset: stroke stays on-panel
      ctx.stroke();
      ctx.globalAlpha = 1;
      const label = alert.type === 'attention' ? 'NEEDS YOU' : 'DONE';
      const proj = (alert.project || '').slice(0, 16);
      ctx.fillStyle = col;
      ctx.fillRect(18, SCREEN_H - 42, SCREEN_W - 36, 26);          // banner pill
      ctx.fillStyle = '#0c0c0f';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 12px Consolas, "Courier New", monospace';
      ctx.fillText(proj ? (label + '  ·  ' + proj) : label, SCREEN_W / 2, SCREEN_H - 29);
      ctx.restore();
    }
  }

  function recompute() {
    const sTok = (demoSession != null) ? demoSession * sessionBudget : sessionVal;
    const wTok = (demoWeek != null) ? demoWeek * weekBudget : weekVal;
    sessionTarget = Math.min(1, sTok / sessionBudget);
    weekTarget = Math.min(1, wTok / weekBudget);
  }

  // ---------- dev controls (all outside the device box) ----------
  const sbudget = document.getElementById('sbudget');
  const wbudget = document.getElementById('wbudget');
  sbudget.addEventListener('input', (e) => { const m = parseFloat(e.target.value); if (m > 0) { sessionBudget = m * 1e6; recompute(); } });
  wbudget.addEventListener('input', (e) => { const m = parseFloat(e.target.value); if (m > 0) { weekBudget = m * 1e6; recompute(); } });

  for (const b of document.querySelectorAll('[data-live], [data-s]')) {
    b.addEventListener('click', () => {
      if (b.dataset.live) { demoSession = null; demoWeek = null; }
      else { demoSession = (+b.dataset.s) / 100; demoWeek = (+b.dataset.w) / 100; }
      recompute();
    });
  }
  // debug hook for automated screenshots: __preview(88, 72) snaps instantly; __live() returns to real data
  window.__preview = (s, w) => { demoSession = s / 100; demoWeek = (w == null ? s : w) / 100; recompute(); sessionShown = sessionTarget; weekShown = weekTarget; };
  window.__live = () => { demoSession = null; demoWeek = null; recompute(); };

  const updated = document.getElementById('updated');
  async function poll() {
    try {
      const r = await fetch('/usage', { cache: 'no-store' });
      const d = await r.json();
      sessionVal = d.session ? d.session.total : (d.hour ? d.hour.total : 0);
      weekVal = d.week ? d.week.total : 0;
      alert = d.alert || { type: 'none', project: '' };
      recompute();
      updated.textContent = 'updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      alert = { type: 'none', project: '' };   // feed dropped: don't let a stale flash stick on
      updated.textContent = 'waiting for server…';
    }
  }

  function frame() {
    sessionShown += (sessionTarget - sessionShown) * 0.08;
    weekShown += (weekTarget - weekShown) * 0.08;
    draw();
    requestAnimationFrame(frame);
  }

  poll();
  setInterval(poll, 3000);
  requestAnimationFrame(frame);
</script>
</body>
</html>
